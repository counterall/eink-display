<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="A quiet, bilingual clock, weather and GitHub Trending dashboard." />
    <script>
      (function () {
        try {
          var savedSettings = JSON.parse(localStorage.getItem('kindle-settings-v1'));
          // Keep in sync with THEME_COLORS in src/model.js (light is the unclassed default).
          var colors = { dark: '#000000', sky: '#eef4fb', sage: '#eef5ec', lavender: '#f3f0fa', mint: '#eaf5f3' };
          var theme = savedSettings && savedSettings.theme;
          if (typeof theme === 'string' && Object.prototype.hasOwnProperty.call(colors, theme)) {
            document.documentElement.className += ' theme--' + theme;
            document.querySelector('meta[name="theme-color"]').setAttribute('content', colors[theme]);
          }
        } catch (error) {}
      })();
    </script>
    <title>Clock & Weather</title>
  </head>
  <body>
    <div id="root"><p style="padding:24px;font-family:sans-serif">正在加载 / Loading…<br />如果页面一直停在这里，请检查浏览器是否启用 JavaScript。<br />If this stays visible, check JavaScript support in your browser.</p></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
